{% extends 'base.html' %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Change password</h1>
  {% if error %}<div class="flash flash-error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="cp">Current password</label><input id="cp" name="current_password" type="password" autocomplete="current-password" required>
    <label for="np">New password (min {{ min_length }} characters)</label><input id="np" name="new_password" type="password" autocomplete="new-password" required>
    <label for="cf">Confirm new password</label><input id="cf" name="confirm_password" type="password" autocomplete="new-password" required>
    <button class="btn btn-primary" type="submit">Update password</button>
  </form>
</div>
{% endblock %}
